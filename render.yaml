services:
  - type: web
    name: lifegraph-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      # DATABASE_URL: BẮT BUỘC đặt trong Render dashboard (Postgres). Thiếu thì dữ liệu chỉ nằm trên đĩa tạm và mất khi deploy lại.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
